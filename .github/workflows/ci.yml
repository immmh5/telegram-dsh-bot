name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linter (optional)
        run: npm run lint 2>/dev/null || true
        
      - name: Verify structure
        run: |
          echo "Project structure:"
          ls -la
          echo "Source files:"
          ls -la src/